<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TrainForever Museum — Profile</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background: #11161b;
            color: white;
            font-family: Arial, sans-serif;
        }

        .profile-page {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .profile-card {
            background: #20262c;
            border: 2px solid #d4af37;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,.45);
        }

        h1 {
            margin-top: 0;
            color: #f4d86a;
            text-align: center;
        }

        p {
            color: #d5d9dd;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #f4d86a;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #626b74;
            background: #0d1115;
            color: white;
            font-size: 1rem;
        }

        textarea {
            min-height: 110px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #d4af37;
            color: #17120a;
            font-weight: 900;
            font-size: 1rem;
        }

    </style>

</head>

<body>

    <main class="profile-page">

        <section class="profile-card">

            <h1>👤 Museum Profile</h1>

            <p>
                Create your TrainForever Museum profile.
            </p>

            <label for="displayName">
                Display Name
            </label>

            <input
                id="displayName"
                type="text"
                placeholder="Your display name"
            >

            <label for="bio">
                About You
            </label>

            <textarea
                id="bio"
                placeholder="Tell us about your railroad interests..."
            ></textarea>

            <button type="button">
                SAVE PROFILE
            </button>

        </section>

    </main>

</body>

</html>
